---
paths:
  main_dir: /path/to/your/data   # Add the path to your output here
  plots_dir: ./Results
  weights_dir: /n/holylfs06/LABS/jacob_lab/Shared/GEOS-CHEM/gcgrid/gcdata/ExtData/GCHP/RegriddingWeights

data:
  # NOTE: flip_levels indexes a dataset's vertical levels from the top
  # of the atmosphere instead of from the surface.  Set it the same way
  # for ref and dev unless you really mean to compare opposite ends of
  # the column; setting it for only one side makes a single-level plot
  # show, say, the model top of ref beside the surface of dev.  GCPy
  # warns if the two disagree.
  ref:
    label: "GCC_ref"
    dir: GCC_ref
    subdir: OutputDir
    file: GEOSChem.SpeciesConc.20190701_0000z.nc4
    flip_levels: False
  dev:
    label: "GCC_dev"
    dir: GCC_dev
    subdir: OutputDir
    file: GEOSChem.SpeciesConc.20190701_0000z.nc4
    flip_levels: False

options:
  verbose: False
  restrict_vars: []
  level_plot:
    create_plot: True
    pdfname: single_level_comparison.pdf
    level_to_plot: 0
  zonal_mean:
    create_plot: True
    pdfname: zonal_mean_comparison.pdf
    yaxis_units: "pressure"        # Values: pressure, level
  totals_and_diffs:
    create_table: True
    diff_type: absdiff             # Values: percent, pctdiff, %, abs, absdiff
    print_to_screen: True
    filename: ''
    skip_small_diffs: True
    small_diff_threshold: 0.0000
  n_cores: -1
