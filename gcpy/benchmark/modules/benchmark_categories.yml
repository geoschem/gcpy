---
#
# benchmark_categories.yml: Assigns GEOS-Chem species to the
# categories used to organize the benchmark plots.
#
# Layout:
#
#   <BenchmarkType>:          FullChemBenchmark,
#                             TransportTracersBenchmark,
#                             or CH4Benchmark
#     <Category>:             One PDF file (and output folder)
#                             per category
#       <Subcategory>:        One PDF bookmark group per
#                             subcategory
#         - <Species>         Bare species name (e.g. SO4)
#
# Species concentration and emissions plots make one PDF for each
# category.  A species may be listed in more than one category.
# Lumped species (e.g. SOx) are defined in lumped_species.yml.
#
# Deposition categories (DryDepVel, WetLossConv, WetLossLS) list
# which species are shown in the dry and wet deposition plots.
#
# A copy of this file is saved with the benchmark output, so the
# categories used for a given set of plots are always on record.
#

# ======================================================================
# Categories for FullChemBenchmark
# ======================================================================
FullChemBenchmark:

  # --------------------------------------------------------------------
  # Aerosols
  # --------------------------------------------------------------------
  Aerosols:
    Dust:
      - DST1
      - DST2
      - DST3
      - DST4
      - DSTbin1
      - DSTbin2
      - DSTbin3
      - DSTbin4
      - DSTbin5
      - DSTbin6
      - DSTbin7
    Inorganic:
      - NH4
      - NIT
      - SO4
      - HMS
    OC_BC:
      - BCPI
      - BCPO
      - OCPI
      - OCPO
    SOA:
      - Complex_SOA
      - Simple_SOA
    Sea_Salt:
      - AERI
      - BrSALA
      - BrSALC
      - ISALA
      - ISALC
      - NITs
      - SALA
      - SALAAL
      - SALACL
      - SALC
      - SALCAL
      - SALCCL
      - SO4s
    Metals:
      - pFe
  Secondary_Organic_Aerosols:
