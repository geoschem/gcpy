      - SOx
      - DMS
      - HMS
      - MSA
      - OCS
      - SO2
      - SO4

  # --------------------------------------------------------------------
  # Organics
  # --------------------------------------------------------------------
  Primary_Organics:
    Alcohols:
      - EOH
      - MOH
    Biogenics:
      - ISOP
      - MTPA
      - MTPO
      - LIMO
    HCs:
