      - Cly
      - ClOx
      - Cl
      - ClO
      - Cl2
      - Cl2O2
      - ClOO
      - ClNO2
      - ClNO3
      - CCl4
      - CFCs
      - CH3Cl
      - CH2Cl2
      - CH3CCl3
      - CHCl3
      - HOCl
      - HCl
      - Halons
      - HCFCs
      - OClO
  Iodine:
    Iodine:
      - Iy
      - IxOy
      - I
      - I2
      - IBr
      - ICl
      - IO
      - IONO
      - IONO2
      - CH3I
      - CH2I2
      - CH2ICl
      - CH2IBr
      - HI
      - HOI
      - OIO

  # --------------------------------------------------------------------
  # Nitrogen, Oxygen, Sulfur, CO, OH
  # --------------------------------------------------------------------
  Nitrogen:
    Nitrogen:
      - NOy
      - NOx
      - HNO2
      - HNO3
      - HNO4
      - MPAN
      - NIT
      - 'NO'   # '' prevents YAML reading this as "no" (i.e. false)
      - NO2
      - NO3
      - N2O5
      - MPN
      - PAN
      - PPN
      - N2O
      - NHx
      - NH3
      - NH4
      - MENO3
      - ETNO3
      - IPRNO3
      - NPRNO3
      - AONITA
      - ETHN
      - BZPAN
